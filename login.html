<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
   
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        
         body { 
       
            background: linear-gradient(rgba(47, 53, 58, 0.85), rgba(47, 53, 58, 0.85)), 
                        url('1.png'); 
            background-size: cover; 
            background-position: center;
            background-attachment: fixed;
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        
        .login-card { 
            background: #ffffff;
            padding: 60px; 
            border-radius: 5px; 
            width: 500px; 
            text-align: center; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.4); 
            border-top: 8px solid #8fbc8f; 
        }

        .logo { 
            width: 90px; 
            margin-bottom: 20px; 
            filter: grayscale(1);
        }
        
        h2 { 
            color: #2f353a; 
            font-weight: 800; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-bottom: 35px;
            font-size: 28px;
        }

       
        .form-label { 
            font-weight: bold; 
            color: #2f353a; 
            text-transform: uppercase; 
            font-size: 12px; 
            letter-spacing: 1px;
        }
        
        .form-control {
            border-radius: 0; 
            padding: 15px;
            background-color: #fcfcfc; 
            border: 1px solid #cccccc;
            font-size: 16px;
        }

        .form-control:focus {
            border-color: #8fbc8f;
            box-shadow: none;
            outline: none;
        }

        .password-wrapper { position: relative; }
        .toggle-password { 
            position: absolute; 
            right: 15px; 
            top: 42px; 
            cursor: pointer; 
            border: none; 
            background: none; 
            font-size: 12px; 
            color: #8fbc8f;
            font-weight: bold;
            text-transform: uppercase;
        }

    
        .btn-primary {
            background: #2f353a; 
            border: 1px solid #8fbc8f; 
            padding: 15px;
            border-radius: 0; 
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            color: #8fbc8f;
            width: 100%; 
            text-transform: uppercase;
        }

        .btn-primary:hover {
            background: #8fbc8f; 
            color: #ffffff;
            transform: scale(1.02);
        }

        .forgot-link { 
            font-size: 12px; 
            color: #2f353a; 
            text-decoration: none; 
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer; 
            margin-top: 25px;
            display: inline-block;
            border-bottom: 1px solid transparent;
        }
        .forgot-link:hover { 
            color: #8fbc8f; 
            border-bottom: 1px solid #8fbc8f;
        }
        
    </style>
    </style>
</head>
<body>

    <div class="login-card">

        <img src="Logo.png" alt="Logo" class="logo">
        <h2 class="mb-4">Login</h2>

        <div id="status"></div>


        <form onsubmit="authenticated(event)">
            <div class="mb-3 text-start">
                <label class="form-label">Username</label>
                <br>
                <input type="text" id="uname" class="form-control" placeholder="Enter Username" required>
            </div>
            
            <div class="mb-3 text-start password-wrapper">
                <label class="form-label">Password</label>
                <br>
                <input type="password" id="Pass" class="form-control" placeholder="Enter Password" required>
                <button type="button" class="toggle-password" onclick="toggleView()">Show</button>
            </div>
            <br>
            <div class="text-start mb-4">
                <input type="checkbox" id="stay-logged">
                <label for="stay-logged" style="font-size: 14px; color: #666;">Stay logged in</label>
            </div>
<br>
         
            <input type="submit" class="btn btn-primary w-100 mb-3" value="Login" style="border-radius: 25px; background: #00c2ff; border: none;">
        </form>
        <p class="forgot-link" onclick="resetCredentials()">Forgot username / password?</p>
    </div>

    <script>

        let correctUser = "Seatwork 1 ICT";
        let correctPass = "ICTSW1";

        function authenticated(event) {
            event.preventDefault();
            
            let username = document.getElementById('uname').value;
            let password = document.getElementById('Pass').value;
            let statusDiv = document.getElementById('status');

            if (username === correctUser && password === correctPass) {
                alert("Welcome");
            
                window.location.href = "dashboard.html"; 
            } else {
                alert("Incorrect username and/or password.");
                statusDiv.innerHTML = "<p class='text-danger fw-bold'>Access Denied</p>";
            }
        }


        function toggleView() {
            let passInput = document.getElementById('Pass');
            let toggleBtn = document.querySelector('.toggle-password');
            
            if (passInput.type === "password") {
                passInput.type = "text";
                toggleBtn.textContent = "Hide";
            } else {
                passInput.type = "password";
                toggleBtn.textContent = "Show";
            }
        }


        function resetCredentials() {
            let newUser = prompt("Enter new Username:", correctUser);
            let newPass = prompt("Enter new Password:", correctPass);
            
            if (newUser && newPass) {
                correctUser = newUser;
                correctPass = newPass;
                alert("Credentials updated! You can now login with the new info.");
            }
        }

        
    </script>
</body>
</html>
